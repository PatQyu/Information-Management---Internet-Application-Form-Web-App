<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Converge ICT Application Form</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class = "login">
        <h1>Login</h1>

        <label for = "app_ID">Application ID:</label>
        <input type = "text" id = "app_ID" name = "app_ID" placeholder = "APP-*********-*">

        <label for = "app_emailAddress">Primary Email:</label>
        <input type = "email" id = "app_emailAddress" name = "app_emailAddress" placeholder = "converge@email.com">

        <button type = "button" id = "loginBtn">Login</button>

        <h3>No Application yet?</h3>
        <button type = "button" id = "applyBtn">Start an application</button>
    </div>

    <script src="login.js"></script>
</body>
</html>
