<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Converge ICT Application Form</title>
    <link rel="stylesheet" href="application_page.css">
</head>
<body>

    <div class="form-container">
        <div class="form-header">
            <h1>CONVERGE ICT Application Form</h1>
            <p>Please fill out the details completely to process your application.</p>
        </div>

        <form id="convergeForm">
            <!-- Hidden Operational Variables -->
            <input type="hidden" id="app_ID" name="app_ID">
            <input type="hidden" id="app_date" name="app_date">

            <!-- SECTION 1: Core Application & Plan -->
            <div class="form-section">
                <h2>1. Service Selection</h2>
                <div class="grid-2">
                    <div class="form-group">
                        <label for="plan_ID">Available Plans</label>
                        <select id="plan_ID" required>
                            <option value="" disabled selected>-- Choose a Plan --</option>
                            <option value="PLN-F1500">FiberX 1500 (Up to 200 Mbps)</option>
                            <option value="PLN-F2000">FiberX 2000 (Up to 400 Mbps)</option>
                            <option value="PLN-F3500">FiberX 3500 (Up to 800 Mbps)</option>
                            <option value="PLN-S2S">Surf2Sawa (Prepaid Fiber)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="app_type">Applicant Type</label>
                        <select id="app_type" required>
                            <option value="" disabled selected>-- Select Subtype --</option>
                            <option value="RESIDENTIAL">Residential</option>
                            <option value="COMMERCIAL">Commercial</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- SECTION 2: Core Applicant Data (Supertype) -->
            <div class="form-section">
                <h2>2. Primary Account Information</h2>
                <div class="grid-2">
                    <div class="form-group">
                        <label for="app_name">Full Name / Authorized Signatory</label>
                        <input type="text" id="app_name" placeholder="Full Name" required>
                    </div>
                    <div class="form-group">
                        <label for="app_gender">Gender</label>
                        <select id="app_gender" required>
                            <option value="" disabled selected>-- Select --</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label for="app_contactNo">Primary Contact No.</label>
                        <input type="tel" id="app_contactNo" placeholder="09XXXXXXXXX" pattern="[0-9]{11}" required>
                    </div>
                    <div class="form-group">
                        <label for="app_secondaryContactNo">Secondary Contact No.</label>
                        <input type="tel" id="app_secondaryContactNo" placeholder="09XXXXXXXXX" pattern="[0-9]{11}">
                    </div>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label for="app_emailAddress">Primary Email Address</label>
                        <input type="email" id="app_emailAddress" placeholder="name@example.com" required>
                    </div>
                    <div class="form-group">
                        <label for="app_secondaryEmailAddress">Secondary Email Address</label>
                        <input type="email" id="app_secondaryEmailAddress" placeholder="backup@example.com">
                    </div>
                </div>
            </div>

            <!-- SECTION 3: Dynamic Subtype Sections -->
            
            <!-- RESIDENTS SUBTYPE FIELDS -->
            <div id="residentialFields" class="form-section dynamic-section hidden">
                <h2>3. Residential Profile Details</h2>
                <div class="grid-2">
                    <div class="form-group">
                        <label for="app_birthDate">Birth Date</label>
                        <input type="date" id="app_birthDate">
                    </div>
                    <div class="form-group">
                        <label for="app_civilStatus">Civil Status</label>
                        <select id="app_civilStatus">
                            <option value="" disabled selected>-- Select --</option>
                            <option value="Single">Single</option>
                            <option value="Married">Married</option>
                            <option value="Divorced">Divorced</option>
                            <option value="Widowed">Widowed</option>
                        </select>
                    </div>
                </div>
                <div class="grid-2">
                    <div class="form-group">
                        <label for="app_mothersName">Mother's Maiden Name</label>
                        <input type="text" id="app_mothersName" placeholder="First Name, Middle Name, Last Name">
                    </div>
                    <div class="form-group">
                        <label for="app_spouseName">Spouse Name (If Applicable)</label>
                        <input type="text" id="app_spouseName" placeholder="Full Name of Spouse">
                    </div>
                </div>
                <div class="form-group" style="width: 50%; padding-right: 7.5px;">
                    <label for="app_nationality">Nationality</label>
                    <input type="text" id="app_nationality" placeholder="e.g. Filipino">
                </div>
            </div>

            <!-- COMMERCIAL SUBTYPE FIELDS -->
            <div id="commercialFields" class="form-section dynamic-section hidden">
                <h2>3. Commercial Entity Details</h2>
                <div class="grid-2">
                    <div class="form-group">
                        <label for="app_businessName">Registered Business Name</label>
                        <input type="text" id="app_businessName" placeholder="Company Name Inc.">
                    </div>
                    <div class="form-group">
                        <label for="app_industry">Industry</label>
                        <input type="text" id="app_industry" placeholder="e.g. Technology, Retail, Finance">
                    </div>
                </div>
                <div class="grid-2">
                    <div class="form-group">
                        <label for="app_tin">Tax Identification Number (TIN)</label>
                        <input type="text" id="app_tin" placeholder="XXX-XXX-XXX-XXX">
                    </div>
                    <div class="form-group">
                        <label for="app_companyIDNo">Company ID No.</label>
                        <input type="text" id="app_companyIDNo" placeholder="Employee/Corporate Registration ID">
                    </div>
                </div>
                <div class="form-group" style="width: 50%; padding-right: 7.5px;">
                    <label for="app_department">Department / Office</label>
                    <input type="text" id="app_department" placeholder="e.g. IT, Procurement, Admin">
                </div>
            </div>

            <!-- SECTION 4: Logistics & Installation Address (Supertype) -->
            <div class="form-section">
                <h2>4. Installation Address & Logistics</h2>
                <div class="form-group">
                    <label for="app_address">Full Installation Address</label>
                    <input type="text" id="app_address" placeholder="Unit, Street, Barangay, City, Province" required>
                </div>
                <div class="grid-2">
                    <div class="form-group">
                        <label for="app_serviceOwnership">Property Ownership Status</label>
                        <select id="app_serviceOwnership" required>
                            <option value="" disabled selected>-- Select --</option>
                            <option value="Owned">Owned</option>
                            <option value="Rented">Rented / Leased</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="app_yearsOfResidency">Years of Residency</label>
                        <input type="number" id="app_yearsOfResidency" min="0" placeholder="e.g. 3" required>
                    </div>
                </div>

                <!-- Conditional Lessor Fields (Triggered when Rented) -->
                <div id="lessorFields" class="grid-2 hidden">
                    <div class="form-group">
                        <label for="app_lessorOwner">Lessor / Property Owner Name</label>
                        <input type="text" id="app_lessorOwner" placeholder="Landlord Name">
                    </div>
                    <div class="form-group">
                        <label for="app_lessorOwnerContactNo">Lessor Contact Number</label>
                        <input type="tel" id="app_lessorOwnerContactNo" placeholder="09XXXXXXXXX" pattern="[0-9]{11}">
                    </div>
                </div>

                <div class="form-group" style="width: 50%; padding-right: 7.5px;">
                    <label for="app_companyPaid">Is this subscription company-paid?</label>
                    <select id="app_companyPaid" required>
                        <option value="No">No</option>
                        <option value="Yes">Yes</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="submit-btn">Submit Application</button>
        </form>
    </div>

    <script src="application_page.js"></script>
</body>
</html>
